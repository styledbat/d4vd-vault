<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080808"
    >

    <meta
        name="description"
        content="d4vd.vault — private music archive"
    >

    <title>d4vd.vault</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =========================
         TOP NAVIGATION
    ========================== -->

    <header class="topbar">

        <button
            class="brand"
            id="brand-button"
            type="button"
        >
            d4vd.vault
        </button>

        <nav class="top-nav">

            <button
                class="nav-link active"
                id="library-button"
                type="button"
            >
                Library
            </button>

            <button
                class="nav-link"
                id="search-button"
                type="button"
            >
                Search
            </button>

        </nav>

        <div class="top-status">
            <span class="status-dot"></span>
            PRIVATE ARCHIVE
        </div>

    </header>


    <!-- =========================
         MAIN APPLICATION
    ========================== -->

    <main class="site">


        <!-- =========================
             LIBRARY VIEW
        ========================== -->

        <section
            id="library-view"
            class="view active-view"
        >

            <div class="page-heading">

                <div>
                    <p class="eyebrow">
                        d4vd.vault
                    </p>

                    <h1>
                        Library
                    </h1>
                </div>

                <p
                    class="library-total"
                    id="library-total"
                >
                    00 RELEASES
                </p>

            </div>


            <div
                id="album-grid"
                class="album-grid"
            ></div>


            <div
                id="library-empty"
                class="empty-state"
            >
                No releases available.
            </div>

        </section>


        <!-- =========================
             ALBUM VIEW
        ========================== -->

        <section
            id="album-view"
            class="view"
        >

            <button
                class="back-button"
                id="back-to-library"
                type="button"
            >
                ← Library
            </button>


            <section class="release-header">

                <div class="cover-wrap">

                    <img
                        id="album-cover"
                        class="album-cover"
                        src=""
                        alt=""
                    >

                </div>


                <div class="release-info">

                    <p
                        class="release-type"
                        id="album-type"
                    >
                        EP / ARCHIVE
                    </p>

                    <h1 id="album-title">
                        —
                    </h1>

                    <p
                        class="release-meta"
                        id="album-meta"
                    >
                        —
                    </p>


                    <div class="release-actions">

                        <button
                            class="primary-button"
                            id="play-album"
                            type="button"
                        >
                            <span>▶</span>
                            Play
                        </button>

                        <button
                            class="secondary-button"
                            id="shuffle-button"
                            type="button"
                        >
                            Shuffle
                        </button>

                        <button
                            class="secondary-button"
                            id="download-album"
                            type="button"
                        >
                            ↓ Download
                        </button>

                    </div>

                </div>

            </section>


            <section class="track-section">

                <div class="section-heading">

                    <div>
                        <p class="eyebrow">
                            TRACKLIST
                        </p>

                        <h2 id="tracklist-title">
                            —
                        </h2>
                    </div>

                    <p
                        class="track-count"
                        id="track-count"
                    >
                        00
                    </p>

                </div>


                <div class="track-header">

                    <span>#</span>

                    <span>Title</span>

                    <span>Duration</span>

                </div>


                <div
                    id="track-list"
                    class="track-list"
                ></div>


                <div
                    id="album-empty"
                    class="empty-state"
                >
                    No tracks available.
                </div>

            </section>

        </section>


        <!-- =========================
             SEARCH VIEW
        ========================== -->

        <section
            id="search-view"
            class="view"
        >

            <div class="search-page-heading">

                <p class="eyebrow">
                    ARCHIVE SEARCH
                </p>

                <h1>
                    Search the vault.
                </h1>

                <p class="search-description">
                    Search across every release and track.
                </p>

            </div>


            <div class="search-box">

                <span class="search-symbol">
                    /
                </span>

                <input
                    id="search-input"
                    type="search"
                    placeholder="Search tracks or releases..."
                    autocomplete="off"
                >

                <button
                    id="clear-search"
                    class="clear-search"
                    type="button"
                    aria-label="Clear search"
                >
                    ×
                </button>

            </div>


            <div
                id="search-results"
                class="search-results"
            ></div>


            <div
                id="search-empty"
                class="empty-state"
            >
                No results found.
            </div>

        </section>


    </main>


    <!-- =========================
         BOTTOM PLAYER
    ========================== -->

    <footer class="player">

        <div class="player-track">

            <img
                id="player-cover"
                class="player-cover"
                src=""
                alt=""
            >

            <div class="player-track-info">

                <span
                    id="now-title"
                    class="player-title"
                >
                    Select a track
                </span>

                <span
                    id="now-artist"
                    class="player-artist"
                >
                    d4vd
                </span>

            </div>

        </div>


        <div class="player-center">

            <div class="player-buttons">

                <button
                    id="previous-button"
                    class="player-button"
                    type="button"
                    aria-label="Previous track"
                >
                    ‹‹
                </button>

                <button
                    id="play-button"
                    class="play-button"
                    type="button"
                    aria-label="Play"
                >
                    ▶
                </button>

                <button
                    id="next-button"
                    class="player-button"
                    type="button"
                    aria-label="Next track"
                >
                    ››
                </button>

            </div>


            <div class="timeline">

                <span id="current-time">
                    0:00
                </span>

                <input
                    id="progress"
                    class="progress"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1"
                    aria-label="Track progress"
                >

                <span id="total-time">
                    0:00
                </span>

            </div>

        </div>


        <div class="player-volume">

            <span>
                VOL
            </span>

            <input
                id="volume"
                class="volume"
                type="range"
                min="0"
                max="1"
                value="1"
                step="0.01"
                aria-label="Volume"
            >

        </div>

    </footer>


    <!-- AUDIO -->

    <audio
        id="audio"
        preload="metadata"
    ></audio>


    <!-- ZIP LIBRARY -->

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

    <!-- YOUR DATA -->

    <script src="albums.js"></script>

    <!-- SITE LOGIC -->

    <script src="app.js"></script>

    <audio id="audio" preload="metadata"></audio>

    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="albums.js"></script>
    <script src="app.js"></script>

</body>
</html>
